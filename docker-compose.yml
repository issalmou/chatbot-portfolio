services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Aucun volume requis : Chroma Cloud héberge la persistance RAG à
    # distance. Le conteneur n'a besoin que des variables d'environnement
    # (clés Chroma Cloud + providers LLM, voir .env.example).
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
