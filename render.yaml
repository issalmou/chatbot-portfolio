# Render Blueprint — fige runtime: docker de façon versionnée pour ne plus
# jamais dériver silencieusement vers un build Python natif (voir Dockerfile :
# torch y est installé CPU-only, un build natif pip install -r requirements.txt
# récupère à la place le stack CUDA/NVIDIA complet, inutile ici).
#
# Ne s'applique pas automatiquement à un service déjà créé manuellement dans
# le dashboard Render : il faut soit reconfigurer ce service en "Docker" une
# fois, soit le recréer via "New > Blueprint" en pointant sur ce repo.

services:
  - name: chatbot-portfolio
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Chroma Cloud — obligatoires
      - key: CHROMA_API_KEY
        sync: false
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false
      # Doit rester dédiée aux embeddings E5 (768 dim) : ne jamais réutiliser
      # une collection remplie avec un autre modèle d'embedding.
      - key: CHROMA_COLLECTION_NAME
        value: portfolio_rag_e5

      # Sécurité de /upload-content — obligatoire en production
      - key: CONTENT_UPLOAD_TOKEN
        sync: false

      # Providers LLM (fallback Gemini -> Mistral -> Groq -> OpenAI) — au
      # moins une clé configurée. Une clé laissée vide au setup du Blueprint
      # est traitée comme un provider non configuré, simplement ignoré.
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
